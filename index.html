<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sanju Kumar</title>
  <style>
    .profile-pic {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 20px;
  border: 3px solid #38bdf8;
}
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #020617;
      padding: 40px;
      border-radius: 16px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 {
      margin-bottom: 10px;
      font-size: 2.2rem;
    }
    p {
      line-height: 1.6;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="profile.jpg" alt="Sanjay Kumar" class="profile-pic">
    <h1>Hi, I’m Sanjay Kumar 👋</h1>
    <p>
      Student • Aspiring Architect • Future Diplomat 🇮🇳<br>
      I love design, imagination, and big ideas.
    </p>
  </div>
</body>
</html>
